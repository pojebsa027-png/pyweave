{% extends "base.html" %}

{% block title %}New note — {{ app_name }}{% endblock %}

{% block content %}
  <h1>New note</h1>
  <p class="muted">Title is required, the body is not.</p>

  <form method="post" class="card">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Save note</button>
  </form>
{% endblock %}
