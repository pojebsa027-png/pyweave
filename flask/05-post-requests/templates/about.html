{% extends "base.html" %}

{% block title %}About — PyWeave{% endblock %}

{% block main %}
  <h1>About</h1>
  <form action="{{ url_for('about') }}" method="post">
    {{ form.hidden_tag() }}
    {{ form.title.label }} {{ form.title() }}
    {{ form.submit() }}
  </form>

  {% if title %}
    <p>You submitted: <strong>{{ title }}</strong></p>
  {% endif %}
{% endblock %}
