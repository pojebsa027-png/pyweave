name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py test -v 2
      - run: python manage.py makemigrations --check --dry-run

  flask:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flask/10-taskapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -c "import app, models, forms, routes; print('flask tree imports clean')"
