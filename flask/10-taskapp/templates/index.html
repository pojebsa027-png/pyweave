{% extends "base.html" %}

{% block main %}
  <h1 class="h3 mb-3">Tasks</h1>

  {% if tasks %}
    {% for task in tasks %}
      <div class="card mb-2">
        <div class="card-body d-flex justify-content-between align-items-center">
          <span>{{ task.title }}</span>
          <span>
            <small class="text-muted me-3">{{ task.created_at.strftime("%Y-%m-%d %H:%M") }}</small>
            <a class="btn btn-sm btn-outline-primary" href="{{ url_for('edit', task_id=task.id) }}">Edit</a>
            <a class="btn btn-sm btn-outline-danger" href="{{ url_for('delete', task_id=task.id) }}">Delete</a>
          </span>
        </div>
      </div>
    {% endfor %}
  {% else %}
    <p class="text-muted">No tasks yet. <a href="{{ url_for('add') }}">Add the first one</a>.</p>
  {% endif %}
{% endblock %}
